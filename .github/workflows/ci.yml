name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  site:
    name: CI result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check generated guide
        run: python3 tools/build_guide.py --check
      - name: Check links, anchors and translations
        run: python3 tools/check_site.py
      - name: Check whitespace
        run: git show --format= --check HEAD
